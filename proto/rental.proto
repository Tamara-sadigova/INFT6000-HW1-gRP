syntax = "proto3";

package rental;

service TextbookRentalService {
  rpc CheckStock (StockRequest) returns (StockResponse);
  rpc GetBook (BookRequest) returns (BookResponse);
  rpc SearchBooks (SearchRequest) returns (SearchResponse);
  rpc RentBook (RentRequest) returns (RentResponse);
  rpc ReturnBook (ReturnRequest) returns (ReturnResponse);
}

// Request and Response definitions
message StockRequest {
  string isbn = 1;
}

message StockResponse {
  bool exists = 1;
  int32 stock = 2;
  bool is_available = 3;
}

message BookRequest {
  string isbn = 1;
}

message BookResponse {
  string isbn = 1;
  string title = 2;
  string author = 3;
  double price_per_day = 4;
  int32 stock = 5;
  bool is_available = 6;
}

message SearchRequest {
  string query = 1;
}

message SearchResponse {
  repeated BookResponse books = 1;
}

message RentRequest {
  string student_id = 1;
  string isbn = 2;
  int32 days = 3;
}

message RentResponse {
  bool success = 1;
  string rental_id = 2;
  double total_price = 3;
  string message = 4;
}

message ReturnRequest {
  string rental_id = 1;
}

message ReturnResponse {
  bool success = 1;
  string message = 2;
}